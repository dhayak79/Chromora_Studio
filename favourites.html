<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Favorites | Chromora Studio</title>
    <link rel="icon" href="images/Glossy%20Multicolour%20Liquid%20C%20Logo.png">
    <!-- <link rel="stylesheet" href="css/favout.css"> -->
    <link rel="stylesheet" href="css/Studio.css">
    <link rel="stylesheet" href="css/explorer.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script type="importmap">{"imports": {
      "colord": "https://esm.sh/colord",
      "colord/plugins/harmonies": "https://esm.sh/colord/plugins/harmonies",
      "colord/plugins/a11y": "https://esm.sh/colord/plugins/a11y"}}
</script>
    
    
    <script type="module" src="js/favourite.js"></script>
    <script src="js/common.js" defer></script>
</head>
<body>
    <div class="back-ground"></div>
    <div class="back-color c1"></div>
    <div class="back-color c2"></div>
    <div class="back-color c3"></div>
    <div class="mouse-glow" id="mouseGlow"></div>
    <div class="background-animation">
        <span style="--i:1;"></span>
        <span style="--i:3;"></span>
        <span style="--i:5;"></span>
        <span style="--i:7;"></span>
        <span style="--i:9;"></span>
        <span style="--i:2;"></span>
        <span style="--i:6;"></span>
        <span style="--i:8;"></span>
        <span style="--i:10;"></span>
    </div>


     <section class="whole-container">
        <section class="header-container glass-card">
            <section class="logo-and-head">
                <a href="./index.html" class="header-logo-link" tabindex="0"></a>
                <h1 class="header-title"><a href="./index.html">Chromora Studio</a></h1>
            </section>
            <section class="header-nav">
                <p> <a href="./index.html" class="head-nav">Studio</a></p>
                <p> <a href="./explorer.html" class="head-nav">Explorer</a></p>
                <p> <a href="./favourites.html" class="head-nav">Favorites</a></p>
                <p id="signInNav"><a href="signin.html" class="head-nav sign-in">Sign In</a></p>
                <div class="profile-menu-container hidden" id="profileMenuContainer">
                    <button type="button" class="profile-avatar" id="profileAvatarBtn" title="Account">
                    </button>
                    <div class="profile-dropdown glass-card hidden" id="profileDropdown">
                        <p class="dropdown-user-info" id="dropdownUserName">User</p>
                        <hr class="dropdown-divider">
                        <button type="button" class="logout-btn" id="logoutBtn">Log out</button>
                    </div>
                </div>
            </section>
        </section>

        <section class="explorer">
            <section class="explorer-card glass-card">
                <section class="explorer-intro">
                    <h2>Your Favorites</h2>
                    <p>Palettes you saved from the Studio. Click a colour to copy it.</p>
                </section>
                <section class="explorer-tools">
                    <input type="search" id="palette-search" placeholder="Search saved palettes by name" aria-label="Search saved palettes" autocomplete="off">
                </section>
            </section>

            <p class="explorer-count" id="result-count"></p>

            <section class="palette-grid" id="palette-grid"></section>

            <p class="explorer-empty" id="empty-state" hidden></p>
        </section>

        <p class="toast" id="toast" role="status"></p>
    </section>
    
</body>
</html>
